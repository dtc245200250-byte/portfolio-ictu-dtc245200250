# ==============================================================================
# HỆ THỐNG WEBSITE PORTFOLIO CÁ NHÂN VÀ TRIỂN KHAI DOCKER - ĐỀ TÀI 13
# Sinh viên thực hiện: Phan Quang Tùng
# Mã số sinh viên: DTC245200250 | Lớp: CNTTK23E
# Trường Đại học Công nghệ Thông tin và Truyền thông (ICTU)
# Năm báo cáo: 2026
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. CƠ SỞ DỮ LIỆU MYSQL 8
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: portfolio_mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-RootSuperSecurePass2026!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-portfolio_db}
      MYSQL_USER: ${MYSQL_USER:-portfolio_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-PortfolioSecurePass2026!}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-RootSuperSecurePass2026!}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  # ----------------------------------------------------------------------------
  # 2. CÔNG CỤ QUẢN TRỊ CƠ SỞ DỮ LIỆU - PHPMYADMIN
  # ----------------------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin:5.2.2-apache
    container_name: portfolio_phpmyadmin
    restart: unless-stopped
    ports:
      - "${PHPMYADMIN_PORT:-8088}:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    networks:
      - backend_net
      - frontend_net
    depends_on:
      mysql:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 3. BACKEND API (NODE.JS + EXPRESS + TYPESCRIPT)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolio_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-portfolio_db}
      MYSQL_USER: ${MYSQL_USER:-portfolio_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-PortfolioSecurePass2026!}
      JWT_SECRET: ${JWT_SECRET:-ICTU_DTC245200250_SecretTokenKey2026FullStackDev!}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-AdminSecurePassword2026!}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-phantung121206@gmail.com}
      INITIAL_ADMIN_FULLNAME: ${INITIAL_ADMIN_FULLNAME:-Phan Quang Tùng}
      LOG_DIR: /var/log/app
    volumes:
      - shared_logs:/var/log/app
    networks:
      - frontend_net
      - backend_net
      - monitoring_net
    depends_on:
      mysql:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 4. FRONTEND APPLICATION (REACT + VITE + TYPESCRIPT)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: portfolio_frontend
    restart: unless-stopped
    networks:
      - frontend_net
    depends_on:
      backend:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 5. REVERSE PROXY NGINX (HTTP + HTTPS SSL + SECURITY HEADERS)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: portfolio_nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - shared_logs:/var/log/nginx
    networks:
      - frontend_net
      - monitoring_net
    depends_on:
      - frontend
      - backend

  # ----------------------------------------------------------------------------
  # 6. GIÁM SÁT HỆ THỐNG - PROMETHEUS
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: portfolio_prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring_net
      - backend_net

  # ----------------------------------------------------------------------------
  # 7. TRỰC QUAN HÓA GIÁM SÁT - GRAFANA
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.2.0
    container_name: portfolio_grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-GrafanaSecurePass2026!}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring_net
    depends_on:
      - prometheus
      - loki

  # ----------------------------------------------------------------------------
  # 8. CONTAINER RESOURCE METRICS - CADVISOR
  # ----------------------------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.2
    container_name: portfolio_cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring_net

  # ----------------------------------------------------------------------------
  # 9. HOST SYSTEM METRICS - NODE EXPORTER
  # ----------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: portfolio_node_exporter
    restart: unless-stopped
    networks:
      - monitoring_net

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: portfolio_mysqld_exporter
    restart: unless-stopped
    command:
      - '--config.my-cnf=/etc/mysqld_exporter/.my.cnf'
    volumes:
      - ./monitoring/exporters/my.cnf:/etc/mysqld_exporter/.my.cnf:ro
    networks:
      - backend_net
      - monitoring_net
    depends_on:
      mysql:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 11. REVERSE PROXY METRICS - NGINX PROMETHEUS EXPORTER
  # ----------------------------------------------------------------------------
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: portfolio_nginx_exporter
    restart: unless-stopped
    command:
      - -nginx.scrape-uri=http://nginx:80/stub_status
    networks:
      - frontend_net
      - monitoring_net
    depends_on:
      - nginx

  # ----------------------------------------------------------------------------
  # 12. CENTRALIZED LOG STORAGE - LOKI
  # ----------------------------------------------------------------------------
  loki:
    image: grafana/loki:3.0.0
    container_name: portfolio_loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - monitoring_net

  # ----------------------------------------------------------------------------
  # 13. LOG SHIPPER - PROMTAIL
  # ----------------------------------------------------------------------------
  promtail:
    image: grafana/promtail:3.0.0
    container_name: portfolio_promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - shared_logs:/var/log:ro
    networks:
      - monitoring_net
    depends_on:
      - loki

# ==============================================================================
# MẠNG NỘI BỘ (DOCKER NETWORKS HARDENING)
# ==============================================================================
networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
  monitoring_net:
    driver: bridge

# ==============================================================================
# DỮ LIỆU BỀN VỮNG (DOCKER VOLUMES PERSISTENCE)
# ==============================================================================
volumes:
  db_data:
  grafana_data:
  prometheus_data:
  loki_data:
  shared_logs:
